name: Update profile statistics

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated language card (requires release approval)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: profile-stats-main
  cancel-in-progress: false

jobs:
  generate:
    if: >-
      github.repository == 'souruuu/souruuu' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.STATS_PUBLISH_LANGUAGES == 'true'))
    environment: profile-stats-read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Require release approval before manual publishing
        if: github.event_name == 'workflow_dispatch' && inputs.publish && vars.STATS_PUBLISH_LANGUAGES != 'true'
        run: |
          echo 'Language publishing has not been approved.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Collect and validate approved data
        env:
          STATS_READ_TOKEN: ${{ secrets.STATS_READ_TOKEN }}
          STATS_PRIVATE_REPOSITORY_IDS: ${{ secrets.STATS_PRIVATE_REPOSITORY_IDS }}
          PUBLISH: ${{ vars.STATS_PUBLISH_LANGUAGES == 'true' && (github.event_name == 'schedule' || inputs.publish) }}
        run: |
          if [[ "$PUBLISH" == 'true' ]]; then
            node scripts/stats/run.mjs generate "$RUNNER_TEMP/stats-output"
          else
            node scripts/stats/run.mjs verify
          fi
      - name: Upload validated language SVG
        id: upload
        if: vars.STATS_PUBLISH_LANGUAGES == 'true' && (github.event_name == 'schedule' || inputs.publish)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-languages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stats-output/languages.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: >-
      github.repository == 'souruuu/souruuu' &&
      github.ref == 'refs/heads/main' &&
      vars.STATS_PUBLISH_LANGUAGES == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require the exact artifact from this run
        env:
          ARTIFACT_ID: ${{ needs.generate.outputs.artifact-id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo 'The validated language artifact ID is missing or invalid.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact-id }}
          path: ${{ runner.temp }}/stats-download
          digest-mismatch: error
      - name: Validate and commit the changed asset
        id: commit
        run: |
          before="$(git rev-parse HEAD)"
          node scripts/stats/publish.mjs "$RUNNER_TEMP/stats-download"
          if [[ "$(git rev-parse HEAD)" != "$before" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Push a fast-forward update
        if: steps.commit.outputs.changed == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
          GIT_TRACE_REDACT: '1'
        run: |
          set +x
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          printf '::add-mask::%s\n' "$auth"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          unset PUSH_TOKEN auth
          git push origin HEAD:refs/heads/main
