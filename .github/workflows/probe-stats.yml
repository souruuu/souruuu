name: Probe profile statistics

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    if: github.repository == 'souruuu/souruuu' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: profile-stats-read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - run: node --test tests/probe/stats.test.mjs
      - name: Probe with GITHUB_TOKEN
        run: node scripts/stats/probe.mjs
        env:
          PROBE_TOKEN: ${{ github.token }}
          PROBE_APPROVED_IDS: ${{ secrets.STATS_PRIVATE_REPOSITORY_IDS }}
      - name: Probe with Metadata Read PAT
        run: node scripts/stats/probe.mjs
        env:
          PROBE_TOKEN: ${{ secrets.STATS_READ_TOKEN }}
          PROBE_APPROVED_IDS: ${{ secrets.STATS_PRIVATE_REPOSITORY_IDS }}
